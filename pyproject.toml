[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genoreps"
version = "0.1.0"
description = "Rapid GTDB Assembly Dereplicator"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas"
]

[project.scripts]
genoreps = "genoreps.cli:main"
